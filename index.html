<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07558a"><title>SmartLinkBox | طلب الجملة</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f7fb;color:#10243a}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#07345b,#0b6ba8);color:#fff;padding:24px;border-radius:22px;margin-bottom:14px}.brand{font-size:28px;font-weight:800}.tag{font-size:13px;opacity:.85}.hero h1{margin:22px 0 7px;font-size:25px}.hero p{margin:0;line-height:1.8}.card{background:#fff;border:1px solid #dce6ef;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #173a5c0c}.product{border-top:4px solid #1681c4}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.head h2{font-size:19px;margin:0}.badge{font-size:12px;background:#e7f3fc;color:#07558a;border-radius:20px;padding:6px 9px}.muted{color:#6c7c8c;font-size:13px}.row{display:grid;grid-template-columns:1fr 145px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #edf1f5}.cap{font-weight:800;direction:ltr;text-align:right}.qty,input[type=text],textarea{width:100%;border:1px solid #cbd9e5;border-radius:11px;padding:0 12px;font-size:16px;background:#fff}.qty,input[type=text]{height:46px}.qty{text-align:center}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f7fafc;border-radius:13px;padding:13px}.stat b{font-size:23px;display:block;margin-top:4px}.field{margin-top:12px}.field label{font-size:14px;font-weight:700;display:block;margin-bottom:7px}textarea{height:82px;padding:12px;resize:vertical;font-family:inherit}.actions{display:grid;grid-template-columns:2fr 1fr;gap:9px}.btn{height:52px;border:0;border-radius:13px;font-size:16px;font-weight:800;cursor:pointer}.wa{background:#18a957;color:#fff}.clear{background:#e9eff4;color:#34495e}.note{text-align:center;color:#718090;font-size:12px;line-height:1.7;padding:5px 12px 20px}@media(max-width:500px){.wrap{padding:11px}.row{grid-template-columns:1fr 120px}.actions{grid-template-columns:1fr}.hero{padding:20px}}</style></head><body><main class="wrap"><section class="hero"><div class="brand">SmartLinkBox</div><div class="tag">Your Data. Always With You.</div><h1>نموذج طلب الجملة</h1><p>يمكنك اختيار أي كميات من جميع المنتجات أدناه، ثم إرسال الطلب كاملًا في رسالة واتساب واحدة.</p></section><div id="products"></div><section class="card"><div class="stats"><div class="stat"><span class="muted">إجمالي القطع</span><b id="total">0</b></div><div class="stat"><span class="muted">البنود المختارة</span><b id="selected">0</b></div></div><div class="field"><label for="customer">اسم المتجر / العميل (اختياري)</label><input id="customer" type="text" maxlength="80" placeholder="مثال: مؤسسة النور"></div><div class="field"><label for="city">المدينة (اختياري)</label><input id="city" type="text" maxlength="60" placeholder="مثال: جدة"></div><div class="field"><label for="notes">ملاحظات (اختياري)</label><textarea id="notes" maxlength="300" placeholder="أي تفاصيل إضافية للطلب"></textarea></div></section><section class="card"><div class="actions"><button id="send" class="btn wa">إرسال الطلب كاملًا عبر واتساب</button><button id="clear" class="btn clear">مسح الطلب</button></div></section><div class="note">الطلب لا يتضمن أسعارًا. يتم تأكيد التفاصيل مع SmartLinkBox عبر واتساب: 0560993436</div></main><script>const P=[{id:'usb',n:'فلاش USB',c:['8GB','16GB','32GB','64GB','128GB','256GB','512GB','1TB']},{id:'sd',n:'بطاقة ذاكرة microSD',c:['8GB','16GB','32GB','64GB','128GB','256GB','512GB','1TB']},{id:'multi',n:'فلاش متعدد المنافذ',c:['1TB']}];const box=document.querySelector('#products'),total=document.querySelector('#total'),selected=document.querySelector('#selected');function render(){P.forEach(p=>{let s=document.createElement('section');s.className='card product';s.innerHTML='<div class="head"><h2>'+p.n+'</h2><span class="badge">'+(p.id==='multi'?'1TB فقط':'سعات متعددة')+'</span></div>';p.c.forEach(c=>{let r=document.createElement('div');r.className='row';r.innerHTML='<div class="cap">'+c+'</div><input class="qty" data-product="'+p.id+'" data-cap="'+c+'" type="number" inputmode="numeric" min="0" max="999999" step="1" placeholder="الكمية">';s.appendChild(r)});box.appendChild(s)});document.querySelectorAll('.qty').forEach(x=>x.addEventListener('input',calc))}function calc(){let t=0,s=0;document.querySelectorAll('.qty').forEach(x=>{let n=Math.max(0,Math.min(999999,parseInt(x.value)||0));if(n){t+=n;s++}});total.textContent=t.toLocaleString('en-US');selected.textContent=s}function productName(id){return P.find(p=>p.id===id).n}document.querySelector('#send').addEventListener('click',()=>{let groups={},sum=0;document.querySelectorAll('.qty').forEach(x=>{let n=Math.max(0,parseInt(x.value)||0);if(n){if(!groups[x.dataset.product])groups[x.dataset.product]=[];groups[x.dataset.product].push('• '+x.dataset.cap+': '+n+' قطعة');sum+=n}});if(!sum){alert('يرجى إدخال كمية واحدة على الأقل.');return}let customer=document.querySelector('#customer').value.trim(),city=document.querySelector('#city').value.trim(),notes=document.querySelector('#notes').value.trim();let m='طلب جملة جديد - SmartLinkBox';if(customer)m+='\nاسم المتجر / العميل: '+customer;if(city)m+='\nالمدينة: '+city;m+='\n';P.forEach(p=>{if(groups[p.id])m+='\n'+p.n+':\n'+groups[p.id].join('\n')+'\n'});m+='\nإجمالي الكمية: '+sum.toLocaleString('en-US')+' قطعة';if(notes)m+='\n\nملاحظات: '+notes;m+='\n\nأرجو تزويدي بتأكيد الطلب والتفاصيل.';location.href='https://wa.me/966560993436?text='+encodeURIComponent(m)});document.querySelector('#clear').addEventListener('click',()=>{if(confirm('هل تريد مسح جميع الكميات والبيانات المدخلة؟')){document.querySelectorAll('.qty').forEach(x=>x.value='');['customer','city','notes'].forEach(id=>document.querySelector('#'+id).value='');calc()}});render();calc();</script></body></html>
